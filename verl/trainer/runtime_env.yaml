working_dir: ./
excludes: [".git//*","checkpoints//","**/.whl","data//*","/pycache//*","/.log","**/.tmp","**/*.swp"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  # Enable this only when you want Ray Distributed Debugger to pause on exceptions.
  # See docs/start/ray_debug_tutorial.rst
  RAY_DEBUG_POST_MORTEM: "0"
