# @package _global_

# Custom variables
model_path: /root/.cache/modelscope/hub/models

defaults:
  - algorithm: ppo
  - actor_rollout_ref: actor_rollout_ref_v2
  - data: sft
  - trainer: fsdp
  - override hydra/launcher: submitit_local

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files: /root/autodl-tmp/gsm8k/data/data_preprocessed/train.parquet
  val_files: /root/autodl-tmp/gsm8k/data/data_preprocessed/test.parquet
  train_batch_size: 16
  max_prompt_length: 512
  max_response_length: 512
  filter_overlong_prompts: True
  truncation: 'error'

actor_rollout_ref:
  model:
    path: ${model_path}/Qwen/Qwen2.5-0.5B-Instruct
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 20
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: False 
      optimizer_offload: False
  rollout:
    log_prob_micro_batch_size_per_gpu: 160
    tensor_model_parallel_size: 1
    name: vllm
    gpu_memory_utilization: 0.6
    n: 5
  ref:
    log_prob_micro_batch_size_per_gpu: 160
    fsdp_config:
      param_offload: True
  
  model:
    lora_rank: 8
    lora_alpha: 16

trainer:
  critic_warmup: 0
  logger: wandb
  project_name: 'verl_grpo_example_gsm8k'
  experiment_name: 'qwen_function_rm'
  n_gpus_per_node: 1
  nnodes: 1
  log_val_generations: 1
  save_freq: 20
  test_freq: 5
  total_epochs: 1
